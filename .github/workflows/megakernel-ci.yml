name: megakernel-ci-test
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: ./repo
          clean: true
          submodules: 'recursive'

      - name: Verify local Docker image
        run: docker image inspect ci_megakernel_image

      - name: Run workflow commands inside local Docker image
        env:
          WORKSPACE_REPO: ${{ github.workspace }}/repo
        run: |
          docker run --rm \
            -v "$WORKSPACE_REPO:/workspace/repo" \
            -w /workspace/repo \
            --device /dev/dri --group-add=$(stat -c "%g" /dev/dri/render* | sort -u) \
            ci_megakernel_image \
            bash -lc '
              set -Eeuo pipefail
              echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
              git config --global --add safe.directory /workspace/repo
              echo "building megakernel:"
              bash MEGAKERNEL_POC/ci_scripts/build_megakernel.sh
              echo "running megakernel tests:"
              bash MEGAKERNEL_POC/ci_scripts/run_megakernel_tests.sh
              echo "🍏 This job'\''s status is ${{ job.status }}."
            '

      - name: Cleanup workspace
        if: always()
        run: |
          sudo chmod -R 777 ${{ github.workspace }} || true
          rm -rf ${{ github.workspace }}/* || true